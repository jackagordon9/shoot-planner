<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudler Homes Shoot Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shoot Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
/*
VOICE: quiet, editorial, a creative director's notebook. Black ink on white, nothing decorative.
IDEA: a printed shot sheet / contact sheet you carry on set.
PICTURE: the reference photographs themselves, large, edge to edge.
COLOUR and TYPE: pure white ground, near-black ink, one grey; Compass Serif titles, Compass Sans everything else (loaded in Settings).
LAYOUT: single calm column on iPhone, controls in the thumb zone; wider grid for planning on desktop.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c0c0c);--ink:light-dark(#111111,#f1f1f1);--mute:light-dark(#6d6d6d,#9b9b9b);
--line:light-dark(#e4e4e4,#2a2a2a);--soft:light-dark(#f4f4f4,#171717);
--serif:"Compass Serif",ui-serif,Georgia,"Times New Roman",serif;
--sans:"Compass Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6vw,46px)}h2{font-size:clamp(24px,4vw,30px)}h3{font-size:20px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:6px max(4vw,12px)}
.brand{font-family:var(--serif);font-size:18px;margin-right:auto;white-space:nowrap;background:none;border:0;padding:8px 0;min-height:44px}
.brand small{font-family:var(--sans);font-size:13px;color:var(--mute);margin-left:6px}
.nav{background:none;border:0;min-height:44px;padding:0 10px;font-size:15px;color:var(--mute)}
.nav[aria-current=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
main{max-width:1080px;margin:0 auto;padding:28px max(4vw,16px) 120px}
.mute{color:var(--mute)}.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:6px 16px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:normal;text-align:center;line-height:1.25;max-width:100%}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.35}
.ic{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:28px 0 24px;overflow-x:auto}
.tab{background:none;border:0;min-height:48px;padding:0 16px 0 0;margin-right:16px;font-size:16px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.card{border-top:1px solid var(--line);padding:20px 0}
.shoots .card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;padding:18px 0}
.thumb{aspect-ratio:4/5;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:3px;background:var(--line);margin-top:10px}.bar i{display:block;height:100%;background:var(--ink)}
.loc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding:22px 0}
.num{font-family:var(--serif);font-size:34px;line-height:1}
.facts{margin:10px 0 12px;display:grid;gap:4px;font-size:15px}
.facts b{font-weight:400;color:var(--mute);display:inline-block;min-width:68px}
.spots{margin:4px 0 6px;border-left:1px solid var(--line);padding-left:14px;display:grid;gap:12px}
.spot-h b{font-weight:400;font-family:var(--serif);font-size:18px}
.spotimgs{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
.spotimg{width:76px;height:76px;padding:0;border:0;background:var(--soft);overflow:hidden;cursor:pointer;border-radius:2px}
.spotimg img{width:100%;height:100%;object-fit:cover;display:block}
.mtop .where[data-act]{cursor:pointer}.mtop .where .sp{color:#f2f2f2;text-decoration:underline;text-underline-offset:3px}
.spot .btn{min-height:38px;font-size:14px;padding:0 12px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.setup{margin:18px 0 8px;padding-top:14px;border-top:1px dashed var(--line)}
.setup-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setup-h h3{margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:20px;margin-top:14px}
.shot{display:flex;flex-direction:column;gap:8px}
.shot .thumb{cursor:pointer;position:relative}
.shot .thumb .count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:2px 7px}
.shot h4{font:400 18px/1.2 var(--serif);margin:2px 0 0}
.tag{font-size:12px;letter-spacing:.02em;border:1px solid var(--line);padding:2px 8px;white-space:nowrap;display:inline-block}
.tag.must{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.done{border-color:var(--ink)}
.stat{font-size:13px;color:var(--mute)}
.drop{border:1.5px dashed var(--mute);aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:14px;cursor:pointer;background:transparent;width:100%;padding:12px;text-align:center}
.locgroup{margin-bottom:40px}
.locgroup>h2{padding-top:16px;border-top:2px solid var(--ink)}
.empty{padding:40px 0;color:var(--mute)}
/* checklist */
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--ink);flex:none}
.check span{flex:1}.check.done span{text-decoration:line-through;color:var(--mute)}
.check small{display:block;color:var(--mute);font-size:13px;text-decoration:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px max(4vw,18px) 28px;border-radius:12px 12px 0 0}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:4px}}
.sheet h2{margin-bottom:16px}
label.f{display:block;margin:14px 0 0;font-size:14px;color:var(--mute)}
.f input:not([type=checkbox]):not([type=radio]),.f textarea,.f select{display:block;width:100%;margin-top:6px;font-size:16px;padding:11px 12px;border:1px solid var(--line);background:var(--bg);border-radius:2px;color:var(--ink)}
.f textarea{min-height:76px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:1px solid var(--line);font-size:15px;color:var(--ink)}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.imgs figure{margin:0;position:relative}
.imgs .thumb{aspect-ratio:1}
.imgs .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;background:rgba(0,0,0,.7);color:#fff;border-radius:2px}
.imgs .mv{position:absolute;bottom:4px;left:4px;width:32px;height:32px;border:0;background:rgba(0,0,0,.7);color:#fff;border-radius:2px}
.imgs .drop{aspect-ratio:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom));z-index:2}
.actions .grow{margin-left:auto}
/* shoot mode */
.mode{position:fixed;inset:0;background:#000;color:#f2f2f2;z-index:40;display:none;flex-direction:column}
.mode.open{display:flex}
.mtop{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.mtop .where{flex:1;font-size:13px;line-height:1.3;color:#aaa;overflow:hidden}
.mtop .where b{display:block;color:#f2f2f2;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .ic{border-color:#333;color:#f2f2f2}
.mode .ic[aria-pressed=true]{background:#f2f2f2;color:#000}
.mprog{display:flex;gap:10px;align-items:center;padding:0 12px 8px;font-size:12px;color:#aaa}
.mprog .bar{flex:1;margin:0;background:#333}.mprog .bar i{background:#f2f2f2}
.mimg{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.mimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.mimg .more{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.7);border:1px solid #444;color:#fff;font-size:13px;padding:4px 10px}
.mimg .none{color:#888;text-align:center;padding:20px}
.mimg .none .btn{border-color:#888;color:#f2f2f2;margin-top:12px}
.minfo{padding:12px 16px 4px}
.minfo h2{font-size:26px;color:#fff}
.minfo p{margin:6px 0 0;font-size:17px;line-height:1.4;color:#ddd}
.minfo .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.minfo .tag{border-color:#444;color:#ccc}.minfo .tag.must{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.minfo .snum{font-size:12px;color:#999;margin-bottom:2px}
.minfo p.cap{font-size:15px;color:#bbb;margin-top:6px}
.minfo details{margin-top:6px;color:#bbb;font-size:15px}.minfo summary{min-height:36px;display:flex;align-items:center;color:#999}
.statusline{margin:8px 16px 0;padding:8px 12px;border:1px solid #444;display:flex;align-items:center;gap:10px;font-size:15px}
.statusline button{margin-left:auto;background:none;border:0;color:#fff;text-decoration:underline;min-height:36px}
.mbot{display:grid;grid-template-columns:64px 1fr 1fr 64px;gap:8px;padding:10px 12px max(14px,env(safe-area-inset-bottom))}
.mbot button{min-height:60px;border:1px solid #444;background:#111;color:#f2f2f2;font-size:17px;border-radius:2px}
.mbot .done{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.mbot button:disabled{opacity:.3}
/* lightbox */
.lb{position:fixed;inset:0;background:#000;z-index:60;display:none}
.lb.open{display:block}
.lbtrack{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lbtrack::-webkit-scrollbar{display:none}
.lbtrack div{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.lbtrack img{max-width:100%;max-height:100%;object-fit:contain}
.lb .ic{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border-color:#444;color:#fff;z-index:2}
.lb .cnt{position:absolute;top:22px;left:16px;color:#ccc;font-size:14px;z-index:2}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;z-index:80;display:none;align-items:center;gap:14px;font-size:15px;max-width:92vw;border-radius:2px}
.toast.open{display:flex}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;min-height:36px;font-size:15px}
.mode~.toast,.toast.dark{background:#f2f2f2;color:#000}
.search{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--ink);border-radius:2px;background:var(--bg);margin:18px 0 6px}
.note{background:var(--soft);padding:14px 16px;font-size:15px;margin:14px 0}
.sample{font-size:13px;color:var(--mute);border:1px solid var(--line);display:inline-block;padding:3px 8px;margin-bottom:10px}
/* iPhone notch / home indicator when running full-screen */
.top{padding-top:max(6px,env(safe-area-inset-top));padding-left:max(4vw,12px,env(safe-area-inset-left));padding-right:max(4vw,12px,env(safe-area-inset-right))}
.mtop{padding-top:max(8px,env(safe-area-inset-top))}
.lb .ic{top:calc(10px + env(safe-area-inset-top))}.lb .cnt{top:calc(22px + env(safe-area-inset-top))}
.toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet{padding-bottom:0}
main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
@media(max-width:600px){.shoots .card{grid-template-columns:76px minmax(0,1fr)}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.shot h4{font-size:16px}.brand small{display:none}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-act="go" data-view="home">Hudler Homes <small>Shoot Planner</small></button>
  <button class="nav" data-act="go" data-view="home" id="nav-home">Shoots</button>
  <button class="nav" data-act="go" data-view="library" id="nav-library">Library</button>
  <button class="nav" data-act="go" data-view="settings" id="nav-settings">Settings</button>
</header>
<main id="app"><p class="mute">Loading…</p></main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<section class="mode" id="mode" aria-label="Shoot mode"></section>
<div class="lb" id="lb"><button class="ic" data-act="lb-close" aria-label="Close">✕</button><div class="cnt" id="lbcnt"></div><div class="lbtrack" id="lbtrack"></div></div>
<div class="toast" id="toast"><span id="toastmsg"></span><button id="toastbtn" hidden>Undo</button></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="pickzip" accept=".zip,application/zip" hidden>
<input type="file" id="pickfont" accept=".otf,.ttf,.woff,.woff2,font/*" hidden>
<script>
{
/* ---------- storage (IndexedDB on this device/browser) ---------- */
const DBN='hudler-shoot-planner';let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','images','fonts'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const iget=(s,k)=>tx(s,'readonly',st=>st.get(k));
const iput=(s,k,v)=>tx(s,'readwrite',st=>st.put(v,k));
const idel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
const ikeys=s=>tx(s,'readonly',st=>st.getAllKeys());
const iclear=s=>tx(s,'readwrite',st=>st.clear());

const STANDALONE=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
let OFFLINE_OK=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');

let S={shoots:[],library:[],locLib:[]};
let ui={view:'home',shootId:null,tab:'plan'};
let saveT=null,storageOK=true;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){clearTimeout(saveT);try{await iput('kv','state',S);await iput('kv','ui',ui);storageOK=true}catch(e){storageOK=false;toast('Could not save on this device: '+(e.message||e))}}

/* ---------- images ---------- */
const urls=new Map();
async function addImages(files){const ids=[];for(const f of files){const id=uid();const buf=await f.arrayBuffer();await iput('images',id,{buf,type:f.type||'image/jpeg',name:f.name||'image',size:f.size,added:Date.now()});ids.push(id)}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return ids}
async function imgURL(id){if(urls.has(id))return urls.get(id);const r=await iget('images',id);if(!r)return null;const u=URL.createObjectURL(new Blob([r.buf],{type:r.type}));urls.set(id,u);return u}
function hydrate(root=document){for(const el of root.querySelectorAll('img[data-img]:not([src])')){imgURL(el.dataset.img).then(u=>{if(u)el.src=u;else el.alt='Image missing'})}}
const img=(id,cls='')=>id?`<img data-img="${esc(id)}" alt="" class="${cls}" decoding="async">`:'';
function pickImages(){return new Promise(res=>{const p=$('#pick');p.value='';p.onchange=async()=>{const f=[...p.files];res(f.length?await addImages(f):[])};p.click()})}
async function gcImages(){const keep=new Set();const locs=[...S.shoots.flatMap(sh=>sh.locations),...S.locLib];for(const l of locs)for(const st of l.setups){(st.images||[]).forEach(i=>keep.add(i));for(const t of st.shots)t.images.forEach(i=>keep.add(i))}for(const p of S.library)p.images.forEach(i=>keep.add(i));for(const k of await ikeys('images'))if(!keep.has(k)){await idel('images',k);urls.delete(k)}}

/* ---------- model helpers ---------- */
const blankShot=()=>({id:uid(),title:'New shot',images:[],prompt:'',dist:['medium'],orient:'vertical',variations:'',props:[],outfit:'',priority:'must',status:'todo'});
const shoot=()=>S.shoots.find(s=>s.id===ui.shootId);
function allShots(sh){const o=[];for(const l of sh.locations)for(const st of l.setups)for(const t of st.shots)o.push(t);return o}
function seq(sh){const o=[];for(const l of sh.locations)for(const st of l.setups)for(const t of st.shots)o.push({t,l,st});return o}
function findShot(sh,id){for(const l of sh.locations)for(const st of l.setups){const i=st.shots.findIndex(t=>t.id===id);if(i>-1)return{l,st,t:st.shots[i],i}}return null}
function findSetup(sh,id){for(const l of sh.locations){const i=l.setups.findIndex(s=>s.id===id);if(i>-1)return{l,st:l.setups[i],i}}return null}
function prog(list){const n=list.length,d=list.filter(t=>t.status!=='todo').length;return{n,d,pct:n?Math.round(d/n*100):0}}
function move(arr,i,dir){const j=i+dir;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true}
const PRI={must:'Must-have',optional:'Optional',creative:'Creative'};
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T12:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})};
const framing=t=>[...(t.dist||[])].map(x=>x[0].toUpperCase()+x.slice(1)).join(' / ')+(t.orient?' · '+(t.orient==='both'?'Vertical + horizontal':t.orient[0].toUpperCase()+t.orient.slice(1)):'');
const maps=a=>`<a class="btn ghost" href="https://maps.apple.com/?q=${encodeURIComponent(a)}" target="_blank" rel="noopener">Apple Maps</a><a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}" target="_blank" rel="noopener">Google Maps</a>`;

function sample(){const sh=(title,dist,orient,priority,prompt,props=[],extra={})=>({...blankShot(),title,dist,orient,priority,prompt,props,...extra});
 return{id:uid(),sample:true,name:'Sample shoot — Agent lifestyle & listing',agent:'Sample agent',date:'',notes:'Sample content to try the tool. Edit or delete it anytime. Warm, natural, approachable; keep wardrobe neutral so the homes read first.',currentShotId:null,packed:{},extras:[{id:uid(),text:'Lint roller'},{id:uid(),text:'Reflector'}],
 locations:[
 {id:uid(),name:'Residential listing — interior',address:'Listing address, Baltimore, MD',parking:'Confirm driveway or street parking with the agent',time:'45 min',outfit:'Outfit 1 — neutral knit, tailored trousers',setups:[
  {id:uid(),name:'Living room sofa',shots:[sh('Seated portrait',['medium'],'both','must','Sit forward on the sofa edge, forearms on knees, hands loosely together. Chin slightly down, eyes to lens.',['Neutral throw pillow','Coffee table book'],{variations:'Try one with hands apart, one with a small smile vs. a full laugh.'}),
   sh('Lean-back laugh',['wide'],'horizontal','creative','Lean into the corner, one arm along the sofa back. Look off-camera and laugh at something I say.',['Neutral throw pillow'])]},

function packLists(sh){const props=new Map(),ward=new Map();
 for(const{t,l}of seq(sh)){if(t.status==='skipped')continue;for(const p of t.props){const k=norm(p);if(!k)continue;if(!props.has(k))props.set(k,{text:p.trim(),from:[]});props.get(k).from.push(t.title)}
  if(t.outfit){const k=norm(t.outfit);if(!ward.has(k))ward.set(k,{text:t.outfit,from:[]});ward.get(k).from.push(t.title)}}
 for(const l of sh.locations)if(l.outfit){const k=norm(l.outfit);if(!ward.has(k))ward.set(k,{text:l.outfit,from:[]});ward.get(k).from.push(l.name)}
 return{props,ward}}

 const item=(key,text,sub)=>{const on=!!sh.packed[key];return`<label class="check ${on?'done':''}"><input type="checkbox" data-act="pack" data-key="${esc(key)}" ${on?'checked':''}><span>${esc(text)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`};
 const all=[...props.keys()].map(k=>'p:'+k).concat([...ward.keys()].map(k=>'w:'+k),sh.extras.map(e=>'x:'+e.id));const packed=all.filter(k=>sh.packed[k]).length;

 <h2 style="margin-top:28px">Extra items</h2>${sh.extras.map(e=>`<div class="row" style="flex-wrap:nowrap">${item('x:'+e.id,e.text).replace('<label class="check','<label style="flex:1" class="check')}<button class="ic" data-act="del-extra" data-id="${e.id}" aria-label="Remove item">✕</button></div>`).join('')}
 <form id="extraform" class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="extratext" placeholder="Add an item" style="flex:1;font-size:16px;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button class="btn solid">Add</button></form>
 <button class="btn ghost" data-act="unpack" style="margin-top:18px">Uncheck all</button>`}

async function fillStorage(){const el=$('#storageinfo');if(!el)return;let t=storageOK?'Saving is working.':'Saving failed on this device.';
 try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();t+=` Using about ${(e.usage/1048576).toFixed(1)} MB${e.quota?` of roughly ${(e.quota/1048576/1024).toFixed(1)} GB available to this site`:''}.`}
  if(navigator.storage?.persisted){t+=(await navigator.storage.persisted())?' The browser has marked this storage as persistent.':' The browser hasn’t granted persistent storage, so backups matter.'}}catch(e){}
 const n=(await ikeys('images')).length;el.textContent=t+` ${n} reference photo${n===1?'':'s'} stored.`;
 for(const k of['serif','sans','sansb']){const f=await iget('fonts',k);const s=$('#font-'+k);if(s)s.textContent=f?'Loaded: '+f.name:'Not loaded'}}

/* ---------- zip backup (stored, uncompressed: photos are already compressed) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){const parts=[],cen=[];let off=0;const enc=new TextEncoder();
 for(const f of files){const name=enc.encode(f.name),d=f.data,crc=crc32(d);const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,name.length,true);
  parts.push(h.buffer,name,d);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,name);off+=30+name.length+d.length}
 const cs=cen.reduce((a,b)=>a+b.byteLength,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
function readZip(buf){const dv=new DataView(buf);let p=buf.byteLength-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;if(p<0)throw new Error('Not a zip file');
 const n=dv.getUint16(p+10,true);let c=dv.getUint32(p+16,true);const out={};const dec=new TextDecoder();
 for(let i=0;i<n;i++){if(dv.getUint32(c,true)!==0x02014b50)throw new Error('Damaged zip');const meth=dv.getUint16(c+10,true),size=dv.getUint32(c+20,true),nl=dv.getUint16(c+28,true),xl=dv.getUint16(c+30,true),cl=dv.getUint16(c+32,true),lo=dv.getUint32(c+42,true);
  const name=dec.decode(new Uint8Array(buf,c+46,nl));if(meth!==0)throw new Error('This zip was re-compressed by another app. Use the original backup file.');
  const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);out[name]=new Uint8Array(buf,ds,size);c+=46+nl+xl+cl}return out}
const extOf=t=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif','image/gif':'gif'}[t]||'img');

 openSheet(`<h2>${esc(label)} ready</h2><p class="small">${esc(name)} · ${mb} MB</p><p class="small mute">On iPhone, choose “Save to Files” in the share sheet, then pick a folder.</p><div class="actions"><button class="btn" data-act="sheet-cancel">Close</button><button class="btn solid grow" id="savefile">Save file</button></div>`);

 'add-setup':d=>editSetup(null,true,shoot().locations.find(l=>l.id===d.id)),
 'edit-setup':d=>editSetup(findSetup(shoot(),d.id),false),
 'setup-up':d=>{const f=findSetup(shoot(),d.id);move(f.l.setups,f.i,-1);save();render()},
 'setup-down':d=>{const f=findSetup(shoot(),d.id);move(f.l.setups,f.i,1);save();render()},
 'add-shot':d=>editShot({...blankShot(),_new:true,_setup:d.id},d.id),
 'edit-shot':d=>editShot(findShot(shoot(),d.id).t),
 'shot-up':d=>{const f=findShot(shoot(),d.id);move(f.st.shots,f.i,-1);save();render()},
 'shot-down':d=>{const f=findShot(shoot(),d.id);move(f.st.shots,f.i,1);save();render()},
 'upload-shot':async d=>{const ids=await pickImages();if(!ids.length)return;const t=findShot(shoot(),d.id).t;t.images.push(...ids);save();if($('#mode').classList.contains('open'))drawMode();else render();toast(`Added ${ids.length} photo${ids.length>1?'s':''}`)},
 'lb-shot':d=>lightbox(findShot(shoot(),d.id).t.images),
 'lb-spot':d=>{const f=findSetup(shoot(),d.id)||(()=>{for(const l of S.locLib){const st=l.setups.find(s=>s.id===d.id);if(st)return{st}}})();if(f)lightbox(f.st.images,+(d.i||0))},
 'lb-spot-cur':()=>{const sh=shoot();const c=findShot(sh,sh.currentShotId);if(c&&(c.st.images||[]).length)lightbox(c.st.images)},
 'lb-pose':d=>lightbox(S.library.find(p=>p.id===d.id).images),
 'lb-mode':(d,el)=>{if(el.dataset.swiped){delete el.dataset.swiped;return}const sh=shoot();lightbox(findShot(sh,sh.currentShotId).t.images)},
 'lb-close':()=>{$('#lb').classList.remove('open');$('#lbtrack').innerHTML=''},
 'from-lib':d=>{libTarget={shootId:ui.shootId,setupId:d.id};libTab='poses';ui.view='library';render();scrollTo(0,0)},
 'from-loclib':()=>{libTarget={shootId:ui.shootId,kind:'loc'};libTab='locations';ui.view='library';render();scrollTo(0,0)},
 'lib-tab':d=>{libTab=d.tab;render()},
 'lib-add-loc':d=>{const l=S.locLib.find(x=>x.id===d.id);const sh=S.shoots.find(s=>s.id===libTarget.shootId);const c=copyLoc(l);c.savedId=l.id;sh.locations.push(c);save();toast(`Added “${l.name}” to ${sh.name}`)},
 'edit-saved-loc':d=>editSavedLoc(S.locLib.find(x=>x.id===d.id)),
 'save-loc':d=>saveLocToLib(shoot().locations.find(l=>l.id===d.id)),
 'lib-add':d=>{const p=S.library.find(x=>x.id===d.id);const sh=S.shoots.find(s=>s.id===libTarget.shootId);const f=findSetup(sh,libTarget.setupId);
   const c=clone(p);delete c.tags;f.st.shots.push({...blankShot(),...c,id:uid(),libraryId:p.id,status:'todo'});save();toast(`Added “${p.title}” to ${f.st.name}`)},
 'lib-done':()=>{ui.shootId=libTarget.shootId;ui.view='shoot';ui.tab=libTarget.kind==='loc'?'plan':'shots';libTarget=null;save();render();scrollTo(0,0)},
 'bulk-poses':()=>{const p=$('#pick');p.value='';p.onchange=async()=>{const fs=[...p.files];if(!fs.length)return;const tag='imported '+new Date().toISOString().slice(0,10);let n=0;
   for(const f of fs){const[id]=await addImages([f]);S.library.unshift({...blankShot(),id:uid(),title:(f.name||'Pose').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()||'Pose',images:[id],priority:'optional',tags:tag});n++;if(n%5===0||n===fs.length)toast(`Importing ${n}/${fs.length}…`)}
   await flush();libTab='poses';render();toast(`Added ${n} poses. Search “imported” to find them.`)};p.click()},
 pdf:()=>doPdf().catch(e=>toast('PDF failed: '+e.message)),
 'send-shoot':async()=>{try{const sh=shoot();toast('Preparing shoot file…');const blob=await buildShootFile(sh);await saveFile(blob,(sh.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'shoot')+'-shoot.zip','Shoot file')}catch(e){toast('Couldn’t make shoot file: '+e.message)}},
 'import-shoot':()=>{const p=$('#pickzip');p.value='';p.onchange=async()=>{const f=p.files[0];if(!f)return;try{const{z,d}=readPlannerZip(await f.arrayBuffer());
   const names=d.state.shoots.map(s=>s.name||'Untitled');const dup=d.state.shoots.filter(s=>S.shoots.some(x=>x.id===s.id)).map(s=>s.name);
   if(d.kind!=='shoot'&&!names.length&&!d.state.library.length)throw new Error('No shoots found in this file');
   const msg=dup.length?`Import ${names.length} shoot${names.length>1?'s':''}? You already have “${dup.join('”, “')}”, which will be replaced with the copy in this file, including its done/skipped marks.`:`Add ${names.length?'“'+names.join('”, “')+'”':'this file'} to your shoots? Nothing you already have will change.`;
   if(!await ask(msg,dup.length?'Import and replace':'Import'))return;const r=await importPlannerFile(z,d);ui.view='home';render();
   toast(`Imported: ${r.added} new${r.replaced?`, ${r.replaced} updated`:''}${r.poses?`, ${r.poses} poses`:''}${r.locs?`, ${r.locs} locations`:''}`)}catch(e){toast('Import failed: '+e.message)}};p.click()},
 'new-pose':()=>editPose({...blankShot(),title:'New pose',tags:'',_new:true}),
 'edit-pose':d=>editPose(S.library.find(p=>p.id===d.id)),
 pack:(d,el)=>{const sh=shoot();if(el.checked)sh.packed[d.key]=true;else delete sh.packed[d.key];save();render()},
 unpack:()=>{shoot().packed={};save();render()},
 'del-extra':d=>{const sh=shoot();sh.extras=sh.extras.filter(e=>e.id!==d.id);delete sh.packed['x:'+d.id];save();render()},
 mode:()=>openMode(),'mode-close':()=>closeMode(),
 'mode-prev':()=>modeStep(-1),'mode-next':()=>modeStep(1),
 'mode-done':()=>mark('done'),'mode-skip':()=>mark('skipped'),
 'mode-reset':()=>{const sh=shoot();const t=findShot(sh,sh.currentShotId).t;const prev=t.status;t.status='todo';save();drawMode();toast('Back to to-do',()=>{t.status=prev;save();drawMode()},true)},
 'mode-filter':()=>{M.mustOnly=!M.mustOnly;const sh=shoot();if(M.mustOnly){const c=findShot(sh,sh.currentShotId)?.t;if(!c||c.priority!=='must'||c.status!=='todo'){const n=seq(sh).find(x=>x.t.priority==='must'&&x.t.status==='todo');if(n)sh.currentShotId=n.t.id}}save();drawMode()},
 'mode-list':()=>modeListSheet(),
 'mode-jump':d=>{const sh=shoot();sh.currentShotId=d.id;if(M.mustOnly&&!modeList(sh).some(x=>x.t.id===d.id))M.mustOnly=false;closeSheet();save();drawMode()},
 'sheet-cancel':()=>closeSheet(),
 export:()=>doExport().catch(e=>toast('Backup failed: '+e.message)),
 import:()=>{const p=$('#pickzip');p.value='';p.onchange=async()=>{const f=p.files[0];if(!f)return;if(!await ask('Replace everything in this browser with this backup?','Restore'))return;
   try{const r=await restoreBackup(await f.arrayBuffer());render();toast(`Restored ${r.shoots} shoots and ${r.images} photos`)}catch(e){toast('Restore failed: '+e.message)}};p.click()},
 font:d=>{const p=$('#pickfont');p.value='';p.onchange=async()=>{const f=p.files[0];if(!f)return;try{const buf=await f.arrayBuffer();const fam=d.role==='serif'?'Compass Serif':'Compass Sans';const ff=new FontFace(fam,buf,{weight:d.role==='sansb'?'600':'400'});await ff.load();document.fonts.add(ff);
   await iput('fonts',d.role,{buf,name:f.name});toast('Font loaded: '+f.name);fillStorage()}catch(e){toast('That file couldn’t be read as a font')}};p.click()},
 'font-del':async d=>{await idel('fonts',d.role);toast('Font removed. It goes away fully after you reopen the tool.');fillStorage()},
 'add-sample':()=>{S.shoots.push(sample());save();toast('Sample shoot added');ui.view='home';render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'&&el.type==='checkbox'&&e.type==='click'&&el.dataset.act==='pack')return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='pack')A.pack(el.dataset,el)});
document.addEventListener('input',e=>{if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;render();const q=$('#libq');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='extraform'){e.preventDefault();const t=v('extratext');if(t){shoot().extras.push({id:uid(),text:t});save();render();$('#extratext')?.focus()}}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#lb').classList.contains('open'))A['lb-close']();else if($('#scrim').classList.contains('open'))closeSheet();else if($('#mode').classList.contains('open'))closeMode()}
 if($('#mode').classList.contains('open')&&!$('#scrim').classList.contains('open')&&!$('#lb').classList.contains('open')){if(e.key==='ArrowRight')modeStep(1);if(e.key==='ArrowLeft')modeStep(-1)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});

/* ---------- boot ---------- */
(async()=>{try{const s=await iget('kv','state');if(s){S=s;S.library||=[];S.locLib||=[];const u=await iget('kv','ui');if(u)ui=u}else{S.shoots=[sample()];await flush()}loadFonts();gcImages()}
 catch(e){storageOK=false;S.shoots=[sample()];setTimeout(()=>toast('This browser isn’t allowing saved data. Changes will be lost when you close the page.'),300)}
 if(ui.view==='shoot'&&!shoot())ui.view='home';render();
 // offline support: only when served from a real web address (GitHub Pages etc.), never inside Claude's viewer
 try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{OFFLINE_OK=true;if(ui.view==='settings')render()}).catch(()=>{})}}catch(e){}
 if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}})();
window.__hh={get S(){return S},flush,buildBackup,restoreBackup,buildPdf,buildShootFile};
}
</script>
</body>
